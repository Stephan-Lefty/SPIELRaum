# Road to Vostok – das erste Profil, das durchgemessen wurde.
#
# Godot 4.6.2, Windows-Bau unter GE-Proton11-1, sechzehn Mods,
# GTX 1070 auf Wayland.
#
# Gemessen am 30.09.2026, zwei Läufe von je rund zehn Minuten:
#
#                      D3D12        Vulkan
#     Mittel           49,0         49,3    Bilder/s
#     1-%-Tief         15,8          0,0
#     Ladezeit           24           25    Sekunden
#     Aussetzer           5            9    Sekunden
#
# Zwei Erkenntnisse daraus, beide gegen die Erwartung:
#
# 1. **Der Renderer ist es nicht.** Die Vermutung war, der Umweg über
#    vkd3d-proton koste Leistung. Er kostet nichts: 49,0 gegen 49,3 ist
#    Rauschen. Godot fährt in beiden Fällen "Forward Mobile", und die
#    GTX 1070 langweilt sich dabei - ihr Power-Limit bremste an 0,014 %
#    der Laufzeit.
#
# 2. **Die Platte war es.** Beide Läufe zeigten 24 bis 25 Sekunden
#    Ladezeit und Aussetzer beim Nachladen; beim längsten stand das Bild
#    vier Sekunden still. Das Spiel lag auf einer Hitachi von 2010:
#
#        am Stück   112 MB/s      je Sprung   7,76 ms
#
#    Auf der SSD, wohin es am 30.09.2026 umgezogen ist:
#
#        am Stück   509 MB/s      je Sprung   0,13 ms
#
#    Viereinhalbmal so schnell am Stück, sechzigmal beim Springen.
#
# Was daraus für den nächsten Lauf erwartet wird - noch ungemessen:
# Ladezeit auf 6 bis 9 Sekunden (ein Rest bleibt, die sechzehn Mods
# werden beim Start eingehängt, und das ist Rechenarbeit), Aussetzer
# verschwinden, Bildrate unverändert bei ~49.

[spiel]
name         = "Road to Vostok"
steam_app_id = 1963610
engine       = "godot"

[system]
# GameMode konnte am 30.09.2026 den Taktregler nicht setzen: Die
# Polkit-Regel des Manjaro-Pakets steht auf allow_active=no, siehe
# docs/gamemode.md. Der Eintrag bleibt trotzdem stehen - er schadet
# nicht und greift, sobald die Berechtigung eingerichtet ist.
gamemode      = true
nicht_stoeren = true

[umgebung]
__GL_SHADER_DISK_CACHE      = "1"
__GL_SHADER_DISK_CACHE_SIZE = "4294967296"
__GL_THREADED_OPTIMIZATIONS = "1"

[start]
# Bleibt eingeschaltet, obwohl die Messung keinen Gewinn zeigt: Vulkan
# kostet auch nichts, und der Weg ohne Übersetzungsschicht ist der
# geradere. Wer das anders sieht, nimmt die Zeile heraus - der
# Ausgangswert mit D3D12 steht oben.
argumente = ["--rendering-driver", "vulkan"]

[messen]
mangohud = true

# Keine [dateien]-Abschnitte. Die override.cfg dieses Spiels führt den
# Mod-Loader an; sie anzufassen ohne belegten Grund wäre ein Risiko ohne
# Gegenwert. Wenn es so weit ist, sorgt "zusammenfuehren = true" dafür,
# dass der Eintrag stehen bleibt - tests/test_godot_cfg.py wacht darüber.
