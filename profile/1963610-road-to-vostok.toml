# Road to Vostok – das erste Profil, das vollständig durchgemessen wurde.
#
# Godot 4.6.3, Windows-Bau unter GE-Proton11-1, sechzehn Mods,
# GTX 1070 auf Wayland, seit dem 30.09.2026 auf einer SSD.
#
# ===================================================================
# Der eine Hebel, der wirkt, sitzt IM Spiel - nicht daneben.
# ===================================================================
#
# Gemessen am 01.10.2026, zwei Laeufe gegeneinander, bei denen sich nur
# die Grafikeinstellungen unterschieden (Mods aktiv, SSD, Vulkan):
#
#                    Optik      Ausgeglichen   Leistung
#   Beleuchtung      Hoch       Mittel         Niedrig
#   Kantenglaettung  MSAA 4x    MSAA 2x        aus
#   Mittel           41,3       48,6           61,1
#   1-%-Tief         15,1       26,7           29,0
#   Messdauer        10,4 min   23,7 min       7,5 min
#
# Der Sprung liegt im ERSTEN Schritt: Von Optik auf Ausgeglichen gewinnt
# man 77 % beim 1-%-Tiefstwert, von Ausgeglichen auf Leistung nur noch
# 9 %. Der zweite Schritt kostet vor allem Bildqualitaet.
#
# Zur Vorsicht: Die 61,1 stammen aus 7,5 Minuten und sind damit
# optimistisch - kurze Laeufe zeigen zu hohe Werte, siehe docs/messen.md.
# Der Ausgeglichen-Lauf war mit 23,7 Minuten der verlaesslichste.
#
# -------------------------------------------------------------------
# NACHGEMESSEN AM 05.11.2026 - und das Ergebnis widerspricht.
# -------------------------------------------------------------------
#
#                    Optik          Leistung
#   Mittel           47,8           49,2
#   1-%-Tief         24,3           26,3
#   Messdauer        46 min         21 min
#
# Statt 48 % Unterschied im Mittel sind es jetzt 2,9 %. Zwischen
# "Beleuchtung Hoch mit MSAA 4x" und "Beleuchtung Niedrig ohne".
#
# Und selbst diese 2,9 % sind geschoent: Der Optik-Lauf dauerte mehr als
# doppelt so lang, und lange Laeufe fallen niedriger aus.
#
# Was sich seit dem 01.10. geaendert hat: UVE (ein Mod, der eine eigene
# Bildaufbereitung vorschaltet) ist aus, der Mod Loader steht auf 3.4.2,
# die Mods sind andere. Welche dieser Aenderungen den Unterschied
# einebnet, ist NICHT gemessen - und genau das ist der Punkt.
#
# Die Schlussfolgerung von oben gilt damit nicht mehr allgemein. Was
# bleibt: Der Unterschied zwischen zwei Sitzungen ist groesser als der
# zwischen zwei Varianten. Solange nicht mitgeschrieben wird, was sonst
# lief - Mods, GPU-Temperatur, fremde Programme an der Karte -, misst
# SPIELRaum vor allem den Tag. Siehe den offenen Punkt in TODO.md.
#
# Uebernommen wurde trotzdem Optik: Wenn beide Varianten gleich schnell
# sind, nimmt man die schoenere.
#
# -------------------------------------------------------------------
# DRITTE FAHRT, 05. und 09.11.2026 - und jetzt ist der Abstand da.
# -------------------------------------------------------------------
#
#                    Optik          Leistung
#   Mittel           44,5           52,5
#   1-%-Tief         23,5           22,9
#   Messdauer        40 min         12,6 min
#
# 18 % im Mittel, bei gleichem 1-%-Tief. Uebernommen wurde Leistung.
#
# -------------------------------------------------------------------
# DIE WICHTIGSTE ZAHL DES GANZEN PROFILS, 12.11.2026:
# EIN MITLAEUFER KOSTET MEHR ALS JEDE VARIANTE
# -------------------------------------------------------------------
#
# Am 12.11.2026 lief waehrend des Messlaufs OBS mit und nahm auf. Der
# Lauf ist damit als Messung wertlos -- aber er ist der beste Beleg,
# den dieses Profil hat, und zwar weil die Aufnahme MITTEN IM LAUF
# endete. Dasselbe Spiel, dieselbe Variante, derselbe Abschnitt,
# verglichen gegen den Lauf vom 10.11.:
#
#   Minute  2-10, OBS laeuft .....  39,1 gegen 47,2     -17,3 %
#   Minute 11-12, OBS aus ........  56,0 gegen 53,8      +4,1 %
#
# 17 Prozent. Das ist mehr als der Abstand zwischen Optik und Leistung
# und mehr als alles, was in diesem Profil je eingestellt wurde.
#
# Zu sehen ist es in der CPU-Last, Spalte cpu_load, die MangoHud
# ohnehin mitschreibt -- die GPU-Last aendert sich dabei fast nicht,
# OBS kodierte auf dem Prozessor:
#
#   Minute 10 .... CPU 81,8 %   48,8 Bilder/s
#   Minute 11 .... CPU 38,3 %   57,7 Bilder/s   <- Aufnahme endet
#
# Mittel der ersten zwoelf Minuten, alle vier Laeufe:
#
#   Optik    05.11. .... CPU 26,1 %
#   Leistung 09.11. .... CPU 25,7 %
#   Leistung 10.11. .... CPU 28,6 %
#   Leistung 12.11. .... CPU 68,9 %   <- Mitlaeufer, eindeutig
#
# Ein Mitlaeufer ist also aus den eigenen Messdateien erkennbar, auch
# rueckwirkend. Genau das ist der offene Punkt in TODO.md; dies ist
# nach RustDesk am 04.11.2026 der zweite belegte Fall.
#
# -------------------------------------------------------------------
# WAS DAMIT ZUR MESSDAUER OFFEN BLEIBT
# -------------------------------------------------------------------
#
# Hier stand am 10.11. zuerst, die Messdauer allein koste 6 Prozent
# (52,5 ueber 12,6 Minuten gegen 49,4 ueber 96), und am 12.11. dann
# das Gegenteil. Beides war zu schnell geschrieben. Richtig ist:
#
# Belegt ist, dass die Zahl INNERHALB eines Laufs ueber die Laenge
# nicht faellt. Dieselben Laeufe auf ihr eigenes Anfangsstueck
# gekuerzt, die beiden mit Mitlaeufer-Verdacht weggelassen:
#
#   Lauf                 ganz    auf 36 min    auf 12 min
#   Optik    05.11.      44,5        44,1          43,1
#   Leistung 09.11.      52,5        52,5          52,1
#   Leistung 10.11.      49,4        48,1          48,4
#
# Nicht belegt ist dagegen, woher der Abstand zwischen dem 09. und
# dem 10.11. kommt. Auf gleiche zwoelf Minuten gekuerzt bleiben 52,1
# gegen 48,4, also 7,6 Prozent -- der Abstand war von Anfang an da und
# ist damit keine Sache der Dauer. Zwei Sitzungen, zwei Strecken,
# eine Erklaerung: Das war der Fehler, nicht die Richtung.
#
# Folge fuer dieses Profil: Die 18 % der dritten Fahrt sind grosser
# als diese 7,6 Prozent und bleiben damit ein brauchbares Ergebnis.
# Leistung bleibt uebernommen. Siehe den offenen Punkt in TODO.md.
#
# Geaendert wurde in Preferences.tres (vom Spiel selbst verwaltet):
#
#   lighting        3 -> 1     Beleuchtung Hoch   -> Niedrig
#   antialiasing    3 -> 2     Kantenglaettung 4x -> 2x
#
# Die Zahl ist die STELLE IM MENUE, von 1 an gezaehlt - keine Bedeutung,
# die fuer alle Einstellungen gleich waere. Belegt am 01.10.2026:
#
#   antialiasing  1=Aus 2=MSAA2x 3=MSAA4x 4=MSAA8x
#   lighting      1=Niedrig 2=Mittel 3=Hoch 4=Ultra
#   smaa          1=Off 2=On          (im Menue steht Off zuerst)
#   detailShadows 1=An  2=Aus         (im Menue steht An zuerst)
#
# Die letzten beiden Zeilen sehen widerspruechlich aus und sind es nicht:
# Bei SMAA steht im Menue "SMAA Off | SMAA On", bei den Schatten
# "An | Aus". Dieselbe 1 heisst einmal aus und einmal an.
#
# Hier stand bis zum 01.10.2026 die Faustregel "1=An, 2=Aus". Sie stimmte
# fuer die Schatten und war fuer SMAA genau verkehrt. Wer eine solche
# Regel aufstellt, muss sie an mehr als einem Beispiel pruefen.
#
# Zwei Laeufe mit 60,9 und 61,1 - diese Konsistenz hatte an zwei Tagen
# kein anderer Vergleich. MSAA 4x laesst die Karte jedes Bild vierfach
# ueberabtasten - das ist der teure Posten.
#
# SMAA stand bei allen drei Messungen auf AUS. Hier stand bis zum
# 01.10.2026 das Gegenteil: behauptet war, SMAA laufe zusaetzlich mit.
# Der Wert war aber nie etwas anderes als 1. Aufgefallen ist es erst, als
# der Anwender SMAA einschaltete und die Zahl auf 2 sprang.
#
# ===================================================================
# Alles andere, was ueblicherweise empfohlen wird: wirkungslos.
# ===================================================================
#
# Gemessen über vier Läufe von je zehn Minuten am 30.09. und 01.10.2026:
#
#   Vulkan statt D3D12 .............. 0,6 %  = nichts
#   GPU-Power-Limit anheben ......... die Karte bremste an 0,014 %
#                                     der Laufzeit, also nichts zu holen
#   Taktregler auf performance ...... EPP steht ohnehin auf performance;
#                                     GameMode darf hier gar nicht (Polkit)
#   __GL_*-Variablen ................ wirkungslos, siehe unten
#
# Was wirklich bremste, war die Platte:
#
#   Ladezeit auf der Hitachi (2010) ....... 23,8 s
#   Ladezeit auf der Crucial MX500 ......... 6,6 s
#
# Die Bildrate lag vorher wie nachher bei rund 45 - das Spiel lief auch
# auf der Festplatte flüssig. Was störte, waren Ladezeit und
# Nachladehänger von bis zu vier Sekunden Standbild.
#
# **Warnung zur Bildrate:** Innerhalb eines einzigen Laufs schwankte sie
# von 30,9 auf 53,8 Bilder/s, allein je nach Ort im Spiel. Jeder
# Mittelwert-Vergleich zwischen zwei Läufen sagt deshalb mehr über die
# gespielte Stelle als über die Einstellungen. Siehe docs/messen.md.

[spiel]
name         = "Road to Vostok"
steam_app_id = 1963610
engine       = "godot"

[system]
# Bleibt eingeschaltet, obwohl GameMode am 01.10.2026 nichts ausrichten
# konnte: Die Polkit-Regel des Manjaro-Pakets steht auf allow_active=no,
# siehe docs/gamemode.md. Schadet nicht und greift, sobald die
# Berechtigung eingerichtet ist.
gamemode      = true

# Die einzige Einstellung in diesem Profil, die nachweislich etwas tut.
nicht_stoeren = true

# [umgebung] gibt es hier bewusst nicht mehr.
#
# Bis zum 01.10.2026 standen hier __GL_SHADER_DISK_CACHE,
# __GL_SHADER_DISK_CACHE_SIZE und __GL_THREADED_OPTIMIZATIONS. Sie
# stehen in jeder Linux-Gaming-Anleitung, und genau deshalb waren sie
# hier gelandet - ungeprüft.
#
# Es sind Einstellungen des NVIDIA-Treibers für **OpenGL**. Dieses Spiel
# fährt Vulkan; im gesamten Spielprotokoll kommt OpenGL kein einziges
# Mal vor. Die drei Zeilen taten nichts, sahen aber nach Optimierung aus
# - genau die Augenwischerei, gegen die SPIELRaum antritt.

[start]
# Kein gemessener Gewinn (0,6 %), aber auch kein Verlust. Bleibt, weil
# der Weg ohne Übersetzungsschicht der geradere ist; wer das anders
# sieht, nimmt die Zeile heraus.
argumente = ["--rendering-driver", "vulkan"]

[messen]
mangohud = true

# Die Anzeige im Bild: ein Viertel deckend statt MangoHuds halber Vorgabe.
# Angefordert am 12.11.2026 -- der Kasten verdeckte oben links zu viel.
#
# Verschieben geht nur hier ueber "ecke", nicht im laufenden Spiel.
# MangoHuds Tastenkuerzel setzt SPIELRaum, sie wirkten am 12.11.2026 aber
# nicht -- warum, ist ungeklaert, siehe den offenen Punkt in TODO.md.
deckkraft = 0.25

# Von selbst eine Messfahrt beginnen, sobald für dieses Spiel noch keine
# gelaufen ist. Eingeschaltet am 23.10.2026 auf ausdrücklichen Wunsch.
#
# Was das bedeutet: Der nächste Spielstart setzt die erste Variante, der
# übernächste die zweite und so fort. Die Grafikeinstellungen ändern sich
# dabei, ohne dass man es angefordert hat -- das ist der Preis dafür, nicht
# daran denken zu müssen.
#
# Nach der letzten Variante bleibt die Fahrtenakte liegen, bis jemand ein
# Ergebnis übernimmt oder verwirft. Von selbst beginnt dann keine neue.
#
# Abbrechen jederzeit:  spielraum messfahrt <app-id> --abbrechen
fahrt = true

# Nur die beiden Enden messen statt aller vier. Vier Läufe wären drei
# Viertelstunden Spielzeit, und »stephan« ist ohnehin eine eigene Wahl
# und keine Richtung, die zur Auswahl steht.
fahrt_varianten = ["optik", "leistung"]

# Die override.cfg bleibt unangetastet. Sie führt den Mod-Loader an; sie
# anzufassen ohne belegten Grund wäre ein Risiko ohne Gegenwert. Beim
# Spiel-Update am 01.10.2026 hat der Mod-Loader sie von sich aus
# zurückgesetzt und neu geschrieben - ein weiterer Grund, ihm diese Datei
# zu überlassen.

# Die Grafikeinstellungen. Das Spiel verwaltet diese Datei selbst; in
# denselben Datei stehen auch die Tastenbelegungen, weshalb der Leser
# ausschließlich den [resource]-Abschnitt anfasst (spielraum/godot_tres.py).
[dateien.grafik]
pfad = "{praefix}/pfx/drive_c/users/steamuser/AppData/Roaming/Road to Vostok/Preferences.tres"
art  = "godot-tres"

# --- Die drei Richtungen --------------------------------------------------
#
# Die Werte sind 1-basiert, belegt am 01.10.2026:
#     lighting      1=Niedrig 2=Mittel 3=Hoch 4=Ultra
#     antialiasing  1=Aus 2=MSAA2x 3=MSAA4x 4=MSAA8x
#
# Hier stehen nur Stufen, die auf diesem Rechner tatsächlich gesehen
# wurden. "4" wäre laut Menü möglich, ist aber nie dagewesen - und was
# nicht dagewesen ist, steht nicht als Vorgabe in einem Profil.

[varianten.optik]
beschreibung = "hübsch vor flüssig - 44,5 Bilder/s, 1-%-Tief 23,5 (05.11.2026, 40 min)"
grafik = { lighting = 3, antialiasing = 3 }

[varianten.ausgeglichen]
beschreibung = "die Mitte - 48,6 Bilder/s, 1-%-Tief 26,7 (01.10.2026)"
grafik = { lighting = 2, antialiasing = 2 }

[varianten.leistung]
beschreibung = "flüssig vor hübsch - 48,4 bis 52,5 Bilder/s, zwei saubere Läufe (09./10.11.2026)"
grafik = { lighting = 1, antialiasing = 1 }

# --- Stephans eigene Wahl, 01.10.2026 ----------------------------------
#
# Entstanden im Spielmenue, nicht aus einer Tabelle. Sie faehrt mehr
# Effekte als alle drei Varianten oben - Schatten, Wasserreflexionen und
# Zielfernrohre waren dort durchgehend aus - dafuer ohne MSAA.
#
# Die Ueberlegung dahinter: Bei 3840x2160 sieht man Treppenstufen kaum
# noch, und SMAA glaettet nach, was uebrig bleibt - zum Preis von ein bis
# zwei Prozent statt der zwanzig bis vierzig, die MSAA kostet. Dazu ein
# Limit von 60 Bildern, weil beide Monitore 60 Hz liefern; alles darueber
# zeigt niemand an.

[varianten.stephan]
beschreibung = "eigene Wahl: Schatten an, kein MSAA, SMAA an, 60 Bilder"
grafik = { lighting = 3, antialiasing = 1, smaa = 2, detailShadows = 1, reflections = 2, PIP = 1, frameLimit = 1, sharpness = 0.9, exposure = 1.0, contrast = 1.05 }

# exposure und contrast stehen hier mit drin, obwohl sie nichts mit
# Leistung zu tun haben. Grund: Am 01.10.2026 fiel auf, dass das Spiel
# nach dem Umschalten "extrem hell" wirkte. Die Ursache war eine
# Belichtung von 1,05 statt 1,0 - fuenf Prozent, die in den dunklen
# Szenen dieses Spiels deutlich auffallen.
#
# Wer eine Variante anlegt und die Bildwirkung ausspart, laesst sie beim
# Umschalten auf dem Stand der vorigen stehen. Dann wundert man sich
# ueber eine Helligkeit, die niemand gewaehlt hat.

# --- Tastenbelegung -------------------------------------------------------
#
# Links steht, was gedrückt wird, rechts, was das Spiel sehen soll. Gilt nur,
# solange Vostok läuft; siehe docs/tasten.md.
#
# ACHTUNG, hier liegt eine Falle, die am 03.11.2026 zum zweiten Mal zugebissen
# hat: Die Bewegung darf NUR AUF EINER SEITE umgelegt werden. Entweder keyd
# uebersetzt, oder Vostok ist selbst umgebunden -- beides zusammen hebt sich
# auf, und zwar geraeuschlos. Dann tun weder die Pfeiltasten noch WASD etwas.
#
# Am 23.10.2026 wurde der Konflikt aufgeloest, indem die Spielbelegung im
# Menue auf die Vorgabewerte (WASD) zurueckgesetzt wurde. Das hielt nicht:
# Vostok schreibt seine Belegung in dieselbe Preferences.tres, die SPIELRaum
# beim Beenden aus der Sicherung zurueckholt -- die Menueeingabe war mit dem
# naechsten Spielende wieder weg. Die Datei steht inhaltlich seit dem
# 01.10.2026 still; siehe den offenen Punkt in TODO.md.
#
# Deshalb jetzt die andere Seite: Vostok bindet selbst, keyd haelt sich raus.
# Das ist ohnehin der robustere Weg -- es ueberlebt jeden Neustart und haengt
# nicht an einem laufenden Dienst. Belegt in Preferences.tres unter
# actionEvents (Godot-Tastencodes):
#
#   forward  4194320 Pfeil hoch      jump    4194323 Bild hoch
#   backward 4194322 Pfeil runter    sprint  4194324 Bild runter
#   left     4194319 Pfeil links     crouch  4194318 Ende
#   right    4194321 Pfeil rechts    lean_L  4194325 Umschalt rechts
#
# Was hier stehenbleibt, sind die zwei Zuordnungen, die Vostok NICHT selbst
# anbietet: Nachladen und Inventar liegen fest auf R und Tab. Sie kollidieren
# mit nichts, weil Insert und Entf im Spiel unbelegt sind.

[tasten]

insert = "r"
delete = "tab"

# --- Mod Loader -----------------------------------------------------------
#
# Der Vostok Mod Loader haelt die MODS von selbst aktuell -- Reiter
# "Updates" im Spiel, Knopf, fertig. SICH SELBST haelt er nicht aktuell: Er
# prueft nur und bietet "Open Page" an, das eine Webseite oeffnet.
#
# Das ist nicht theoretisch. Am 04.11.2026 lief hier die Fassung 3.2.1,
# waehrend seit dem 06.10.2026 v3.4.2 veroeffentlicht war -- ein Monat
# Rueckstand, nur weil der Weg ueber einen Browser fuehrt.
#
# "vostok" ist eine Kennung aus modloader.QUELLEN, keine Adresse. Wohin sie
# zeigt, entscheidet das Programm; siehe die Sicherheitsregel in CLAUDE.md.
#
# Geprueft und heruntergeladen wird von selbst, im Hintergrund waehrend das
# Spiel laedt. Eingebaut wird nur auf Verlangen:
#
#   spielraum modloader 1963610              was ist da, was ist neu
#   spielraum modloader 1963610 --einbauen   uebernehmen
#   spielraum modloader 1963610 --zurueck    wieder die alte Fassung
#
# Warum nicht von selbst einbauen: Bei einem Fassungswechsel verwirft der
# Loader seinen Hook-Zwischenspeicher, loescht seinen Zustand und setzt die
# override.cfg zurueck. Eine neue Fassung kann damit das Zusammenspiel mit
# den 16 Mods veraendern -- das soll niemanden in der Sekunde ueberraschen,
# in der er spielen wollte.

[modloader]

quelle = "vostok"
