# Road to Vostok – das erste Profil, das vollständig durchgemessen wurde.
#
# Godot 4.6.3, Windows-Bau unter GE-Proton11-1, sechzehn Mods,
# GTX 1070 auf Wayland, seit dem 30.09.2026 auf einer SSD.
#
# ===================================================================
# Dieses Profil ist vor allem eine Liste dessen, was NICHT wirkt.
# ===================================================================
#
# Gemessen über vier Läufe von je zehn Minuten am 30.09. und 01.10.2026:
#
#   Vulkan statt D3D12 .............. 0,6 %  = nichts
#   GPU-Power-Limit anheben ......... die Karte bremste an 0,014 %
#                                     der Laufzeit, also nichts zu holen
#   Taktregler auf performance ...... EPP steht ohnehin auf performance;
#                                     GameMode darf hier gar nicht (Polkit)
#   __GL_*-Variablen ................ wirkungslos, siehe unten
#
# Was wirklich bremste, war die Platte:
#
#   Ladezeit auf der Hitachi (2010) ....... 23,8 s
#   Ladezeit auf der Crucial MX500 ......... 6,6 s
#
# Die Bildrate lag vorher wie nachher bei rund 45 - das Spiel lief auch
# auf der Festplatte flüssig. Was störte, waren Ladezeit und
# Nachladehänger von bis zu vier Sekunden Standbild.
#
# **Warnung zur Bildrate:** Innerhalb eines einzigen Laufs schwankte sie
# von 30,9 auf 53,8 Bilder/s, allein je nach Ort im Spiel. Jeder
# Mittelwert-Vergleich zwischen zwei Läufen sagt deshalb mehr über die
# gespielte Stelle als über die Einstellungen. Siehe docs/messen.md.

[spiel]
name         = "Road to Vostok"
steam_app_id = 1963610
engine       = "godot"

[system]
# Bleibt eingeschaltet, obwohl GameMode am 01.10.2026 nichts ausrichten
# konnte: Die Polkit-Regel des Manjaro-Pakets steht auf allow_active=no,
# siehe docs/gamemode.md. Schadet nicht und greift, sobald die
# Berechtigung eingerichtet ist.
gamemode      = true

# Die einzige Einstellung in diesem Profil, die nachweislich etwas tut.
nicht_stoeren = true

# [umgebung] gibt es hier bewusst nicht mehr.
#
# Bis zum 01.10.2026 standen hier __GL_SHADER_DISK_CACHE,
# __GL_SHADER_DISK_CACHE_SIZE und __GL_THREADED_OPTIMIZATIONS. Sie
# stehen in jeder Linux-Gaming-Anleitung, und genau deshalb waren sie
# hier gelandet - ungeprüft.
#
# Es sind Einstellungen des NVIDIA-Treibers für **OpenGL**. Dieses Spiel
# fährt Vulkan; im gesamten Spielprotokoll kommt OpenGL kein einziges
# Mal vor. Die drei Zeilen taten nichts, sahen aber nach Optimierung aus
# - genau die Augenwischerei, gegen die SPIELRaum antritt.

[start]
# Kein gemessener Gewinn (0,6 %), aber auch kein Verlust. Bleibt, weil
# der Weg ohne Übersetzungsschicht der geradere ist; wer das anders
# sieht, nimmt die Zeile heraus.
argumente = ["--rendering-driver", "vulkan"]

[messen]
mangohud = true

# Keine [dateien]-Abschnitte. Die override.cfg dieses Spiels führt den
# Mod-Loader an; sie anzufassen ohne belegten Grund wäre ein Risiko ohne
# Gegenwert. Beim Spiel-Update am 01.10.2026 hat der Mod-Loader sie von
# sich aus zurückgesetzt und neu geschrieben - ein weiterer Grund, ihm
# diese Datei zu überlassen.
